name: Publish downloadable release

on:
  push:
    tags: ['v*']
  # For a manual retry, select the version tag rather than a branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
      RELEASE_TARGET: ${{ github.sha }}
    steps:
      - name: Require an explicit version tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Run this workflow from a version tag such as v1.0.0.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the tagged publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_TARGET"
          python tests/check_release.py
          test -s RELEASE_NOTES.md

      - name: Upload verified artifacts and publish
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --target "$RELEASE_TARGET" \
              --draft \
              --title "$RELEASE_TAG — AI & ML Engineering Portfolio" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" \
            downloads/AI-ML-Hiring-Portfolio-Plan.html \
            downloads/AI-ML-Hiring-Portfolio-Plan.md \
            downloads/AI-ML-Hiring-Portfolio-Plan.pdf \
            downloads/AI-ML-Hiring-Portfolio-Toolkit.zip \
            downloads/toolkit-manifest.json \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest \
            --title "$RELEASE_TAG — AI & ML Engineering Portfolio" \
            --notes-file RELEASE_NOTES.md
